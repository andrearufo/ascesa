<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ascesa — dalla pietra alle stelle</title>
  <meta name="description" content="A free civilization clicker game: lead a tribe from the Stone Age to a Dyson sphere. 8 eras, 100+ technologies, wars, plagues, climate collapse and rogue AI. Plays in your browser, no install, no ads.">
  <meta name="theme-color" content="#0b0d14">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://andrearufo.github.io/ascesa/">
  <meta property="og:title" content="Ascesa — from stone to the stars">
  <meta property="og:description" content="Lead a tribe from the Stone Age to a Dyson sphere. 8 eras, 100+ techs, plagues, nuclear crises and rogue AI. Free, in your browser.">
  <meta property="og:image" content="https://andrearufo.github.io/ascesa/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Ascesa — from stone to the stars">
  <meta name="twitter:description" content="Lead a tribe from the Stone Age to a Dyson sphere. Free civilization clicker in your browser.">
  <meta name="twitter:image" content="https://andrearufo.github.io/ascesa/assets/og.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">ASCESA</div>
    <div class="era"><b id="era-name"></b><span id="year"></span></div>
    <div id="timeline"></div>
    <nav>
      <button data-act="save" data-t>💾 Salva</button>
      <button data-act="export" data-t>📤 Esporta</button>
      <button data-act="import" data-t>📥 Importa</button>
      <button data-act="newgame" data-t>🔄 Nuova partita</button>
      <button id="lang"></button>
    </nav>
  </header>
  <canvas id="scene"></canvas>

  <main>
    <aside id="left">
      <div class="card">
        <button id="clicker" data-act="click"><span id="click-label"></span><small id="click-value"></small></button>
        <div id="targets" class="chips"></div>
        <p class="hint" data-t>Tastiera: <kbd>Spazio</kbd> o la lettera della risorsa, un click per pressione.</p>
      </div>
      <div class="card"><h3 data-t>Risorse</h3><div id="resources"></div></div>
      <div class="card"><h3 data-t>Civiltà</h3><div id="meters"></div></div>
    </aside>

    <section id="center">
      <div class="tabs" id="tabs"></div>
      <div id="panel"></div>
    </section>

    <aside id="right">
      <div id="crises"></div>
      <div class="card"><h3 data-t>Effetti attivi</h3><div id="effects"></div></div>
      <div class="card grow"><h3 data-t>Cronaca</h3><div id="log"></div></div>
    </aside>
  </main>

  <div id="modal" hidden><div class="box" id="modal-box"></div></div>
  <script type="module" src="js/ui.js"></script>
</body>
</html>
